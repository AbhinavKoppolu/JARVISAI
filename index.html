<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="space-viewport">

        <div class="nebula-array alpha"></div>
        <div class="nebula-array beta"></div>
        <div class="stardust-parallax-field tier-1"></div>
        <div class="stardust-parallax-field tier-2"></div>

        <div class="planetary-force-field"></div>

        <div class="cosmic-comet comet-alpha"></div>
        <div class="cosmic-comet comet-beta"></div>

        <div class="satellite-orbital-station">
            <div class="sat-score"></div>
            <div class="sat-wing-left"></div>
            <div class="sat-wing-right"></div>
            <div class="sat-antenna"></div>
            <div class="sat-dish"></div>
            <div class="signal-wave ring-1"></div>
            <div class="signal-wave ring-2"></div>
        </div>

        <div class="alien-mountain-range backdrop-ridge"></div>
        <div class="alien-mountain-range foreground-peaks"></div>

        <div class="surface-exploration-rover">
            <div class="rover-chasis"></div>
            <div class="rover-sensor-most">
                <div class="rover-optic-eye"></div>
            </div>
            <div class="rover-wheel-assembly">
                <div class="wheel wh-1"></div>
                <div class="wheel wh-2"></div>
                <div class="wheel wh-3"></div>
            </div>
            <div class="rover-status-bubble">TRANSMITTING...</div>
        </div>

    </div>

    <div class="jarvis-container">
        <header>
        <div id="shield-station" style="background: rgba(5, 11, 20, 0.9); border: 2px solid #ff7700; padding: 20px; margin-bottom: 15px; position: relative;">
            <div style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px; font-weight: bold;">
                <span style="color: #66fcf1; letter-spacing: 1px;">🛡️ DEFENSIVE SHIELD SYSTEMS</span>
                <span id="shield-txt" style="color: #ffb703;">100% SECURE</span>
            </div>

            <div style="width: 100%; height: 12px; background: #14151f; border: 1px solid #33343f; padding: 1px; ">

                <div id="shield-bar" style="width: 100%; height: 100%; background: #22c55e; transition: width 0.5s ease, background-color 0.5s ease; box-shadow: 0 0 10px rgba(34, 197, 150, 0.4);"></div>
            </div>

            <div id="shield-quest" style="display: none; margin-top: 10px; border-top: 1px dashed #ef4444; padding-top: 10px; text-align: left;">
                <p style="color: #fca5a5; font-size: 11px; font-weight: bold; animation: warningBlink 1s infinite alternate;">⚠️ CRITICAL: SYSTEM LOCKED. ENTER THE DE-IONIZATION FREQUENCY
                    COMBINATION TO RECHARGE CORE </p>
                <div style="display: flex; gap: 10px; margin-top: 6px;">
                    <input type="text" id="questInput" placeholder="Type combination 'JARVIS-99' here..." style="flex: 1; background: #000; border: 1px solid #ef4444; color: #fff; padding: 5px; font-size: 11px;
                    outline: none;">
                    <button onclick="solveShieldQuest()" style="color: #ef4444; border-color: #ef4444; padding: 0 10px; font-size: 11px;">OVERIDE</button>
                </div>
            </div>
        </div>
            <div class="arc-reactor" id="arcReactor"></div>
            <h1>JARVIS SYSTEM</h1>
            <p class="status" id="statusField">SYSTEM STATUS: ONLINE </p>
        </header>

        <div id="globe-container"></div>

        <div class="chat-display" id="chatDisplay">
            <div class="message system-msg">Welcome back, Sir. Core space telemetry ad mainframe systems are online. Ready for input. </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type or press Mic to speak..." autocomplete="off">
            <button id="micBtn" title="Speak to Jarvis">🎙️</button>
            <button id="sendBtn">SEND</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
    </html>
