<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="jarvis-container">
        <header>
            <div class="arc-reactor" id="arcReactor"></div>
            <h1>JARVIS SYSTEM</h1>
            <p class="status" id="statusField">SYSTEM STATUS:ONLINE</p>
        </header>
        <div id="globe-container"></div>
        <div class="chat-display" id="chatDisplay">
            <div class="message system-msg">Welcome back, Sir. Core mainframe online. Ready for input</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type or press Mic to speak..." autocomplete="off">
            <button id="micBtn" title="Speak to Jarvis">🎙️</button>
            <button id="sendBtn">SEND</button>
        </div>
    </div>
    <script src="https://cdnjs.cloudfare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
